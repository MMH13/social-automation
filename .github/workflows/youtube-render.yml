# social-automation cloud renderer
name: Render YouTube item (Psychology Tube)

on:
  schedule:
    # a few times a week - long-form videos are slow to render (8-12 min of TTS+ffmpeg)
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch:

concurrency:
  group: yt-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install CPU torch first (avoids the 2.5GB CUDA build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-video.txt
      - name: Install ffmpeg + espeak-ng (video / TTS fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Cache kokoro TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-models-v1
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          EOF
      - name: Render next queued item (not published - lands pending_review)
        run: python -m src.render_yt
      - name: Commit rendered item + queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          # scheduled_yt/content.json is only ever written by this workflow, so a
          # straight restore-after-reset is safe (no cross-workflow merge needed here -
          # unlike scheduled_pt/scheduled_x, nothing else touches this file).
          cp scheduled_yt/content.json /tmp/mine.json
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            cp /tmp/mine.json scheduled_yt/content.json
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add scheduled_yt/content.json state/history.jsonl youtube_queue/
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "yt: render item"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - retrying (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push after 5 attempts"
          exit 1
