# social-automation cloud poster
name: Post Psychology Tube meme (FB+IG)

on:
  schedule:
    # 10 posts/day (8 short-form + 2 narrated listicles); 11:00 UTC = 5:00 PM Dhaka
    - cron: "0 0,2,5,7,10,12,15,17,20,22 * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install CPU torch first (avoids the 2.5GB CUDA build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-video.txt
      - name: Install ffmpeg + espeak-ng (reels / TTS fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Cache kokoro TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-models-v1
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF
      - name: Post next item (meme / psych / status / reel)
        run: python -m src.post_pt
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          # Never lose a posted mark: a failed push after a successful post makes the
          # next run publish the same item again (happened to item 77 on 2026-07-28).
          cp scheduled_pt/content.json /tmp/mine.json
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python scripts/merge_queue.py /tmp/mine.json scheduled_pt/content.json
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add scheduled_pt/content.json state/history.jsonl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "pt: mark posted"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - remerging (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push queue state after 5 attempts - item may repost"
          exit 1
      - name: Check queue depth
        id: queue
        if: always()
        run: python scripts/queue_check.py scheduled_pt/content.json 10 "Psychology Tube"
      - name: Open low-queue issue
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Psychology Tube queue running low"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY="Only ${{ steps.queue.outputs.left }} item(s) (~${{ steps.queue.outputs.days }} days at 10/day) left in \`scheduled_pt/content.json\`. Refill it before the queue empties."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Issue #$EXISTING already open - not spamming."
          fi
