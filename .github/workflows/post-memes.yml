# social-automation cloud poster
name: Post Psychology Tube meme (FB+IG)

on:
  schedule:
    # every 3 hours; 11:00 UTC = 5:00 PM Dhaka
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install ffmpeg (needed for reels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          EOF
      - name: Post next item (meme / psych / status / reel)
        run: python -m src.post_pt
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          git add scheduled_pt/content.json state/history.jsonl
          git diff --cached --quiet || git commit -m "pt: mark posted"
          git pull --rebase origin master
          git push
      - name: Check queue depth
        id: queue
        if: always()
        run: python scripts/queue_check.py scheduled_pt/content.json 8 "Psychology Tube"
      - name: Open low-queue issue
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Psychology Tube queue running low"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY="Only ${{ steps.queue.outputs.left }} item(s) (~${{ steps.queue.outputs.days }} days at 8/day) left in \`scheduled_pt/content.json\`. Refill it before the queue empties."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Issue #$EXISTING already open - not spamming."
          fi
