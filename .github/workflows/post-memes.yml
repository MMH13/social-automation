# social-automation cloud poster
name: Post Psychology Tube meme (FB+IG)

on:
  schedule:
    # every 3 hours; 11:00 UTC = 5:00 PM Dhaka
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install ffmpeg (needed for reels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          EOF
      - name: Post next item (meme / psych / status / reel)
        run: python -m src.post_pt
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          git add scheduled_pt/content.json state/history.jsonl
          git diff --cached --quiet || git commit -m "pt: mark posted"
          git pull --rebase origin master
          git push
