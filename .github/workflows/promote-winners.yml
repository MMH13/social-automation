# Pull queue siblings of a breakout Psychology Tube reel to the front (see scripts/promote_winners.py)
name: Promote Psychology Tube winners

on:
  schedule:
    - cron: "40 2,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would move"
        type: boolean
        default: false

# Same group as the poster so this never rewrites the queue while a post is committing its mark.
concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Promote siblings of breakout reels
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry-run"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python scripts/promote_winners.py $FLAG
            git add scheduled_pt/content.json
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "pt: promote siblings of breakout reel(s)"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - redoing on fresh state (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push promoted queue after 5 attempts"
          exit 1
