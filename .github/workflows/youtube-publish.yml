# social-automation cloud poster
name: Publish approved YouTube item (Psychology Tube)

on:
  schedule:
    # frequent and cheap to run - it only ever touches items already marked
    # "approved" by a human via scripts/review_youtube.py, so there's nothing to
    # accidentally auto-publish here.
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: yt-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-youtube.txt
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          EOF
      - name: Publish next approved item
        id: post
        run: |
          python -m src.post_yt
          # Scope the commit step below to just the one item folder this run touched -
          # a concurrent render run may have pushed a brand-new item meanwhile and we
          # must never clobber that.
          ITEM_DIR=$(git status --porcelain youtube_queue/ 2>/dev/null | head -1 | awk '{print $2}' | xargs -r dirname)
          echo "item_dir=$ITEM_DIR" >> "$GITHUB_OUTPUT"
      - name: Commit posted item
        if: always() && steps.post.outputs.item_dir != ''
        env:
          ITEM_DIR: ${{ steps.post.outputs.item_dir }}
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          mkdir -p /tmp/yt_item
          cp -r "$ITEM_DIR"/. /tmp/yt_item/ 2>/dev/null || true
          VIDEO_DELETED=0
          [ ! -f "$ITEM_DIR/video.mp4" ] && VIDEO_DELETED=1
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            # Only $ITEM_DIR is ours this run - reset then replay just that folder so
            # a concurrent render push's brand-new item folder is never touched.
            git reset -q --hard origin/master
            mkdir -p "$ITEM_DIR"
            cp -r /tmp/yt_item/. "$ITEM_DIR/"
            if [ "$VIDEO_DELETED" = "1" ]; then rm -f "$ITEM_DIR/video.mp4"; fi
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add -A "$ITEM_DIR" state/history.jsonl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "yt: mark posted"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - retrying (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push queue state after 5 attempts - item may repost"
          exit 1
