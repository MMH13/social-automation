name: Post Speaking from soul (FB+IG)

on:
  schedule:
    # Poll every 15 min rather than asking for the 7 slots directly. GitHub delivers
    # only a fraction of scheduled runs, ~2h late (measured: 1-5 of 7 per day, median
    # 125 min late), so naming the slots meant most posts were simply never made. At
    # 96 attempts a day even a 30% delivery rate covers every slot soon after it opens.
    # The `gate` job below keeps this cheap: a run with nothing due exits in ~20s.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: posting-ss
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # Bare checkout, no dependencies — decides whether the expensive job runs at all.
  gate:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python scripts/is_due.py scheduled_ss/content.json 7

  post:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install CPU torch first (avoids the 2.5GB CUDA build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-video.txt
      - name: Install ffmpeg + espeak-ng (reels / TTS fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Cache kokoro TTS model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-models-v1
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          SS_FB_PAGE_ID=${{ secrets.SS_FB_PAGE_ID }}
          SS_FB_PAGE_ACCESS_TOKEN=${{ secrets.SS_FB_PAGE_ACCESS_TOKEN }}
          SS_IG_USER_ID=${{ secrets.SS_IG_USER_ID }}
          # OPENAI_API_KEY deliberately NOT passed (2026-08-28, zero-cost policy).
          # It drove gpt-image-1 backgrounds in soul_reel; the account has been out of
          # credit for a while, so every run burned a guaranteed-to-fail API call and
          # ~100s of wall time before falling back to free Pexels/Pixabay footage anyway.
          # Omitting it skips that call entirely and guarantees no OpenAI charge can ever
          # be incurred here, even if credit is topped up later for something else.
          # To re-enable AI backgrounds: add this line back (the secret still exists).
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF
      - name: Post next item (quote card / reel)
        run: python -m src.post_ss
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          cp scheduled_ss/content.json /tmp/mine.json
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python scripts/merge_queue.py /tmp/mine.json scheduled_ss/content.json
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add scheduled_ss/content.json state/history.jsonl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "ss: mark posted"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - remerging (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push queue state after 5 attempts - item may repost"
          exit 1
      - name: Check queue depth
        id: queue
        if: always()
        run: python scripts/queue_check.py scheduled_ss/content.json 6 "Speaking from soul" --only-type=reel
      - name: Open low-queue issue
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Speaking from soul queue running low"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY="Only ${{ steps.queue.outputs.left }} item(s) (~${{ steps.queue.outputs.days }} days at 6/day) left in \`scheduled_ss/content.json\`. Refill it before the queue empties."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Issue #$EXISTING already open - not spamming."
          fi
