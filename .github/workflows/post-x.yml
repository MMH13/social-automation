name: Post to X

on:
  schedule:
    # every 4 hours; 00:00 UTC = 6:00 AM Dhaka
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          X_API_KEY=${{ secrets.X_API_KEY }}
          X_API_SECRET=${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          EOF
      - name: Post next X item
        run: python -m src.post_x
      - name: Commit queue state
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          git pull --rebase
          git add scheduled_x/posts.json state/history.jsonl
          git diff --cached --quiet || git commit -m "x: mark posted"
          git push
