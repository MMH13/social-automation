# social-automation cloud poster
name: Post to X

on:
  schedule:
    # every 4 hours; 00:00 UTC = 6:00 AM Dhaka
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: posting
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          X_API_KEY=${{ secrets.X_API_KEY }}
          X_API_SECRET=${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          EOF
      - name: Post next X item
        run: python -m src.post_x
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          # See post-memes.yml: a lost posted mark means the item publishes twice.
          cp scheduled_x/posts.json /tmp/mine.json
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python scripts/merge_queue.py /tmp/mine.json scheduled_x/posts.json
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add scheduled_x/posts.json state/history.jsonl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "x: mark posted"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - remerging (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push queue state after 5 attempts - item may repost"
          exit 1
      - name: Check queue depth
        id: queue
        if: always()
        run: python scripts/queue_check.py scheduled_x/posts.json 6 "X"
      - name: Open low-queue issue
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="X queue running low"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY="Only ${{ steps.queue.outputs.left }} item(s) (~${{ steps.queue.outputs.days }} days at 6/day) left in \`scheduled_x/posts.json\`. Refill it before the queue empties."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Issue #$EXISTING already open - not spamming."
          fi
