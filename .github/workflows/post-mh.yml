name: Post Mamun Hossain (FB)

on:
  schedule:
    # 3 posts/day to start - cold-start cadence like the other new tracks
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:

concurrency:
  group: posting-mh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt playwright
      - name: Install Chromium for Bengali text rendering
        run: python -m playwright install chromium --with-deps
      - name: Build .env from secrets
        run: |
          cat > .env << EOF
          MH_PAGE_ID=${{ secrets.MH_PAGE_ID }}
          MH_PAGE_ACCESS_TOKEN=${{ secrets.MH_PAGE_ACCESS_TOKEN }}
          EOF
      - name: Post next item (hook card + comment thread)
        run: python -m src.post_mh
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "auto-poster"
          git config user.email "actions@github.com"
          cp scheduled_mh/content.json /tmp/mine.json
          cp state/history.jsonl /tmp/mine.jsonl 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python scripts/merge_queue.py /tmp/mine.json scheduled_mh/content.json
            python scripts/merge_queue.py /tmp/mine.jsonl state/history.jsonl --lines
            git add scheduled_mh/content.json state/history.jsonl
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "mh: mark posted"
            if git push -q origin HEAD:master; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push raced another commit - remerging (attempt $attempt)"
            sleep 5
          done
          echo "::error::could not push queue state after 5 attempts - item may repost"
          exit 1
      - name: Check queue depth
        id: queue
        if: always()
        run: python scripts/queue_check.py scheduled_mh/content.json 3 "Mamun Hossain"
      - name: Open low-queue issue
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Mamun Hossain queue running low"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY="Only ${{ steps.queue.outputs.left }} item(s) (~${{ steps.queue.outputs.days }} days at 3/day) left in \`scheduled_mh/content.json\`. Refill it before the queue empties."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Issue #$EXISTING already open - not spamming."
          fi
